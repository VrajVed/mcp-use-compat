name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # node --test with a glob needs Node 21+; Node 20 only gets a runtime smoke test.
      - name: Test
        if: matrix.node != 20
        run: npm test

      - name: Smoke test the built CLI
        run: |
          node dist/index.js --list-checks > /dev/null
          node dist/index.js --format github --clients cursor,vscode -- npx tsx test/fixtures/servers/clean.ts
          set +e
          node dist/index.js --format github -- npx tsx test/fixtures/servers/bad-tools.ts
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 for bad-tools, got $code"; exit 1; }

      - name: Package contents
        if: matrix.node == 22
        run: npm pack --dry-run
